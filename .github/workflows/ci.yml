name: CI

# Fast, deterministic gates on every push and PR:
#   - the unit suite (`npm test` — node --test reads the .ts sources directly
#     via --experimental-strip-types, no build step). Includes the SCHEDULE
#     conformance suite (conformance/schedule.test.ts) — the same file fero's
#     CI rides cross-repo as its data contract.
#   - the type gate (`npm run typecheck` — four tsc programs: the internal
#     surface + fixtures, classic JSX, automatic JSX, and the SHIPPED
#     types/public.d.ts consumer gate; all noCheck:false).
#
# Deliberately NOT gated here (run locally instead):
#   - `npm run perf` — machine-calibrated absolute budgets (m1–m4); too noisy
#     on shared runners.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Unit + conformance suite
        run: npm test
      - name: Type gate (four programs)
        run: npm run typecheck
