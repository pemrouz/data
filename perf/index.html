<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>data • perf control room</title>
  <link rel="stylesheet" href="../assets/v2.css">
  <link rel="stylesheet" href="./perf.css">
</head>
<body class="perf-app">
  <header class="pbar">
    <a class="mark" href="../index.html"><b>$</b> data<span class="pbar-sub">perf control room</span></a>
    <span class="pbar-trust" id="summary"><!-- reactive: metrics + trust --></span>
    <span class="pbar-spacer"></span>
    <input id="search" type="search" placeholder="filter metrics…" aria-label="filter metrics" autocomplete="off">
    <label class="ix-ctl">sort
      <select id="sort" aria-label="sort by">
        <option value="severity">severity</option>
        <option value="worst">worst</option>
        <option value="value">value</option>
        <option value="id">id</option>
        <option value="harness">harness</option>
      </select>
    </label>
    <button id="group" type="button" aria-pressed="true">grouped</button>
    <button id="expand" type="button" aria-pressed="false">expand all</button>
    <details class="ix-legend">
      <summary>legend</summary>
      <div class="ix-legend-body">
        <span><span class="ix-dot ok"></span> on baseline / healthy</span>
        <span><span class="ix-dot watch"></span> drift (warn)</span>
        <span><span class="ix-dot bad"></span> timing regression</span>
        <span><span class="ix-dot countbad"></span> count moved (deterministic)</span>
        <span><span class="ix-dot gain"></span> improved</span>
        <span><span class="ix-mult good">+5%</span> better than peak (new best)</span>
        <span><span class="ix-mult drift">−4%</span> off peak</span>
        <span><span class="ix-mult bad">−20%</span> well off peak</span>
        <span><span class="ix-mult prov">±% ⌁</span> provisional (run-noise, &lt;2 commits)</span>
      </div>
    </details>
  </header>

  <section id="index" class="ix-table"><!-- index rows render here --></section>

  <script type="importmap">
  { "imports": {
      "data":      "../dist/index.js",
      "data/full": "../dist/full.js"
  } }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
