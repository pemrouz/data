<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./index.css">
<body>
  <div id="loader" class="loader">
    <div class="loader-mark">data<span class="loader-cursor">_</span></div>
    <div class="loader-status">streaming flight records</div>
    <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    <div class="loader-meta">
      <span class="loader-pct">0%</span>
      <span class="loader-sep">·</span>
      <span class="loader-bytes">0.0 / 35.6 MB</span>
      <span class="loader-sep">·</span>
      <span class="loader-rate">…</span>
    </div>
    <div class="loader-detail">231,083 records · January 2001 · ASA Data Expo</div>
  </div>
</body>
<script type="importmap">
{ "imports": {
    "data":          "../../dist/index.js",
    "data/full":     "../../dist/full.js",
    "data/render":   "../../dist/render/index.js",
    "data/devtools": "../../dist/devtools/index.js"
} }
</script>
<script type="module">
  // Opt-in devtools: append ?devtools to the URL to load $.inspect/.graph/
  // .trace/.profile/.fromDOM/.highlight onto the canonical $ and auto-mount
  // the overlay panel. Off by default so the JSX example mirrors the vanilla
  // crossfilter's "byte-clean" baseline.
  if (location.search.includes('devtools')) await import('data/devtools')
  await import('./index.js')
</script>
